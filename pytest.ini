[pytest]

#addopts = --html=report.html --self-contained-html
addopts = --alluredir=temps --clean-alluredir

testpaths = ./testcase/login/
python_files = test*.py
python_classes = Test*
python_functions = test_*


#注册自定义标记
markers =
    api:接口测试
    web:UI测试
    ut:单元测试
    login:登录相关
    pay:支付相关
    ddt:参数化